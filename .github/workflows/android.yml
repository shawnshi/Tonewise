name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2

    steps:
    - name: Configure Git for Windows checkouts
      run: |
        git config --global core.autocrlf false
        git config --global core.symlinks true
        git config --global core.longpaths true
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Apply Windows Media3 FFmpeg patch
      shell: pwsh
      run: .\scripts\apply-media-patch.ps1
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android SDK packages
      run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
    - name: Set up Rust toolchain for tonewise-core
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
    - name: Build tonewise-core Android and desktop JNI libraries
      shell: pwsh
      run: |
        .\scripts\build-core-android.ps1
        .\scripts\build-core-desktop.ps1
    - name: Set up MSYS2 for Android FFmpeg build
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          diffutils
          nasm
          perl
          mingw-w64-ucrt-x86_64-gcc
    - name: Build Android FFmpeg archives
      shell: msys2 {0}
      run: |
        module="$(cygpath -u "$GITHUB_WORKSPACE/android/media/libraries/decoder_ffmpeg/src/main")"
        sdk="$(cygpath -u "$ANDROID_HOME")"
        ndk="$sdk/ndk/28.2.13676358"
        bash "$module/jni/build_ffmpeg.sh" "$module" "$ndk" windows-x86_64 21 flac alac
    - name: Run Android unit tests with Gradle
      working-directory: android
      run: .\gradlew.bat :musikr:testDebugUnitTest :app:testDebugUnitTest
    - name: Build debug APK with Gradle
      working-directory: android
      run: .\gradlew.bat app:packageDebug
    - name: Verify R8 minified release APK build
      working-directory: android
      run: .\gradlew.bat :app:assembleRelease -PuseDebugSigning
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tonewise-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
