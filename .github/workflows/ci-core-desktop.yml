name: Rust Core & Windows Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-and-desktop:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "9.0.x"
    - name: Run Rust workspace tests
      working-directory: core
      run: cargo test --workspace
    - name: Build native Rust core DLL and CLI
      shell: pwsh
      run: .\scripts\build-core-desktop.ps1
    - name: Run Desktop & SyncHost unit tests
      run: dotnet test desktop/Tonewise.sln -p:Platform=x64
    - name: Build Windows Desktop Release binary
      run: dotnet build desktop/src/Tonewise.Desktop/Tonewise.Desktop.csproj -c Release -p:Platform=x64
