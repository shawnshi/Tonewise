name: Core and Desktop Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-and-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Rust workspace tests
        working-directory: core
        run: cargo test --workspace

      - name: Build tonewise-ffi and tonewise-cli release binaries
        working-directory: core
        run: cargo build --release -p tonewise-ffi -p tonewise-cli

      - name: Run Desktop unit & integration tests
        run: dotnet test desktop/tests/Tonewise.Desktop.Tests/Tonewise.Desktop.Tests.csproj -c Release

      - name: Build WinUI 3 Desktop application (Release x64)
        run: dotnet build desktop/src/Tonewise.Desktop/Tonewise.Desktop.csproj -c Release -p:Platform=x64
