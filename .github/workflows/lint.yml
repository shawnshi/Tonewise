name: Android Lint

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  lint:
    runs-on: windows-latest
    env:
      JAVA_TOOL_OPTIONS: -Dhttps.protocols=TLSv1.2

    steps:
    - name: Configure Git for Windows checkouts
      run: |
        git config --global core.autocrlf false
        git config --global core.symlinks true
        git config --global core.longpaths true
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Apply Windows Media3 FFmpeg patch
      shell: pwsh
      run: .\scripts\apply-media-patch.ps1
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android SDK packages
      run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
    - name: Check formatting with spotless
      working-directory: android
      run: .\gradlew.bat spotlessCheck
    - name: Test musikr with Gradle
      working-directory: android
      run: .\gradlew.bat musikr:testDebugUnitTest
