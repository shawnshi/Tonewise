[workspace]
resolver = "2"
members = [
    "crates/tonewise-metadata",
    "crates/tonewise-rules",
    "crates/tonewise-dsp-core",
    "crates/tonewise-sync",
    "crates/tonewise-ffi",
    "crates/tonewise-cli",
]

[workspace.package]
version = "1.0.7"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
blake3 = "1"
jni = "0.21"
lofty = "0.22"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2"
walkdir = "2"
